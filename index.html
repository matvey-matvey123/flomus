<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>МузАрхив — слушай музыку</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(145deg, #0b1a2e 0%, #0a111f 100%);
            font-family: 'Segoe UI', 'Inter', system-ui, -apple-system, 'Roboto', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
        }

        .login-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(8, 15, 28, 0.94);
            backdrop-filter: blur(14px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            transition: all 0.3s ease;
        }

        .login-card {
            background: rgba(18, 28, 45, 0.96);
            backdrop-filter: blur(16px);
            border-radius: 2.5rem;
            padding: 2.5rem 2rem;
            width: 90%;
            max-width: 420px;
            box-shadow: 0 25px 45px rgba(0,0,0,0.6), 0 0 0 1px rgba(255,255,255,0.08);
            text-align: center;
            animation: fadeInUp 0.4s ease-out;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px) scale(0.96); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .login-card .logo {
            font-size: 3rem;
            margin-bottom: 0.2rem;
        }

        .login-card h2 {
            font-size: 2rem;
            margin-bottom: 0.3rem;
            background: linear-gradient(135deg, #FFF5E0, #B9E6FF);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .login-card .subtitle {
            color: #8e9fbd;
            margin-bottom: 2rem;
            font-size: 0.9rem;
        }

        .login-buttons {
            display: flex;
            flex-direction: column;
            gap: 0.8rem;
        }

        .login-btn {
            border: none;
            padding: 0.9rem;
            border-radius: 2rem;
            font-weight: 700;
            font-size: 1.05rem;
            cursor: pointer;
            transition: 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.6rem;
        }

        .login-btn.user-btn {
            background: linear-gradient(135deg, #2ed573, #26de81);
            color: #0a111f;
        }
        .login-btn.user-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(46, 213, 115, 0.3);
        }

        .login-btn.admin-btn {
            background: linear-gradient(135deg, #ffc107, #ffb300);
            color: #0a111f;
        }
        .login-btn.admin-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(255, 193, 7, 0.3);
        }

        .login-divider {
            color: #4a5a7a;
            font-size: 0.75rem;
            margin: 0.5rem 0;
            letter-spacing: 2px;
        }

        .admin-login-fields {
            margin-top: 1rem;
            padding-top: 1rem;
            border-top: 1px solid rgba(255,255,255,0.08);
        }

        .admin-login-fields .input-group {
            margin-bottom: 0.8rem;
            text-align: left;
        }

        .admin-login-fields .input-group label {
            display: block;
            color: #cbd5e6;
            font-size: 0.75rem;
            font-weight: 500;
            margin-bottom: 0.3rem;
        }

        .admin-login-fields .input-group input {
            width: 100%;
            background: rgba(0, 0, 0, 0.45);
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 1.2rem;
            padding: 0.7rem 1.2rem;
            color: white;
            font-size: 1rem;
            font-family: inherit;
            transition: 0.2s;
            outline: none;
        }

        .admin-login-fields .input-group input:focus {
            border-color: #ffc107;
            box-shadow: 0 0 0 2px rgba(255, 193, 7, 0.25);
        }

        .admin-login-fields .login-submit-btn {
            background: #ffc107;
            border: none;
            width: 100%;
            padding: 0.8rem;
            border-radius: 2rem;
            font-weight: 700;
            font-size: 1rem;
            color: #0a111f;
            cursor: pointer;
            transition: 0.2s;
        }

        .admin-login-fields .login-submit-btn:hover {
            background: #ffdb6e;
            transform: translateY(-2px);
        }

        .error-msg {
            color: #ff8a7a;
            font-size: 0.8rem;
            margin-top: 0.8rem;
            background: rgba(255,80,80,0.1);
            padding: 0.5rem;
            border-radius: 2rem;
            display: none;
        }

        .music-hub {
            max-width: 950px;
            width: 100%;
            background: rgba(15, 25, 45, 0.7);
            backdrop-filter: blur(4px);
            border-radius: 2rem;
            padding: 1.8rem;
            transition: all 0.3s ease;
            display: none;
        }

        .music-hub.visible {
            display: block;
            animation: fadeIn 0.4s;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.97); }
            to { opacity: 1; transform: scale(1); }
        }

        .header-flex {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            margin-bottom: 1rem;
            gap: 0.5rem;
        }

        .header-flex h1 {
            font-size: 1.8rem;
            background: linear-gradient(135deg, #FFF5E0, #B9E6FF);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 0.8rem;
            flex-wrap: wrap;
        }

        .badge {
            padding: 0.3rem 1.2rem;
            border-radius: 40px;
            font-size: 0.75rem;
            font-weight: bold;
            letter-spacing: 0.3px;
        }

        .badge.user {
            background: #2ed573;
            color: #0a111f;
        }

        .badge.admin {
            background: #ffc107;
            color: #0a111f;
        }

        .logout-btn {
            background: rgba(100,100,130,0.3);
            border: 1px solid rgba(255,255,255,0.15);
            padding: 0.3rem 1rem;
            border-radius: 40px;
            cursor: pointer;
            color: #ccc;
            font-size: 0.75rem;
            transition: 0.2s;
        }
        .logout-btn:hover { background: rgba(200,50,50,0.3); }

        .search-area {
            margin-bottom: 1.2rem;
        }

        .search-area input {
            width: 100%;
            background: rgba(0,0,0,0.4);
            border: 1px solid rgba(255,255,255,0.12);
            border-radius: 2rem;
            padding: 0.75rem 1.4rem;
            color: white;
            font-size: 0.95rem;
            font-family: inherit;
            outline: none;
            transition: 0.3s;
        }

        .search-area input:focus {
            border-color: #3b6eff;
            box-shadow: 0 0 0 3px rgba(59,110,255,0.15);
        }

        .search-area input::placeholder {
            color: #5a6f8a;
        }

        .admin-panel {
            background: rgba(0,0,0,0.4);
            border-radius: 1.5rem;
            padding: 1.2rem;
            margin-bottom: 1.2rem;
            border: 1px solid rgba(255,215,0,0.25);
            display: none;
        }

        .admin-panel.visible {
            display: block;
        }

        .admin-title {
            color: #ffd966;
            font-size: 0.85rem;
            margin-bottom: 0.8rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .admin-actions-row {
            display: flex;
            flex-wrap: wrap;
            gap: 0.6rem;
            align-items: center;
        }

        .admin-actions-row input {
            flex: 1;
            min-width: 140px;
            background: rgba(0,0,0,0.5);
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 2rem;
            padding: 0.6rem 1rem;
            color: white;
            font-size: 0.85rem;
            font-family: inherit;
            outline: none;
        }

        .admin-actions-row input:focus {
            border-color: #ffc107;
        }

        .admin-btn {
            background: #ffc107;
            border: none;
            padding: 0.6rem 1.4rem;
            border-radius: 2rem;
            font-weight: 700;
            font-size: 0.85rem;
            cursor: pointer;
            transition: 0.2s;
            color: #1e2a3a;
            white-space: nowrap;
        }
        .admin-btn:hover { background: #ffdb6e; transform: scale(1.02); }

        .admin-hint {
            font-size: 0.7rem;
            color: #ffd966;
            opacity: 0.7;
            margin-top: 0.5rem;
        }

        .admin-hint code {
            background: rgba(0,0,0,0.3);
            padding: 0.1rem 0.5rem;
            border-radius: 4px;
        }

        .track-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 0.6rem;
            margin-bottom: 1.2rem;
            max-height: 340px;
            overflow-y: auto;
            padding: 0.3rem 0.1rem;
        }

        .track-grid::-webkit-scrollbar {
            width: 4px;
        }
        .track-grid::-webkit-scrollbar-track {
            background: rgba(255,255,255,0.05);
            border-radius: 4px;
        }
        .track-grid::-webkit-scrollbar-thumb {
            background: #3b6eff;
            border-radius: 4px;
        }

        .track-item {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            background: rgba(20, 35, 60, 0.8);
            border-radius: 200px;
            padding: 0.25rem 0.6rem 0.25rem 1.2rem;
            border: 1px solid rgba(255,255,255,0.08);
            transition: 0.2s;
        }

        .track-item:hover {
            border-color: rgba(255,255,255,0.2);
        }

        .track-btn {
            background: transparent;
            border: none;
            color: #eef4ff;
            font-size: 0.82rem;
            font-weight: 500;
            cursor: pointer;
            padding: 0.4rem 0;
            font-family: inherit;
            transition: 0.2s;
        }

        .track-btn:hover {
            color: #7aafff;
        }

        .track-btn.active {
            color: #3b6eff;
            font-weight: 700;
            text-shadow: 0 0 8px rgba(59,110,255,0.3);
        }

        .admin-actions {
            display: flex;
            gap: 0.25rem;
        }

        .icon-btn {
            border: none;
            border-radius: 30px;
            width: 26px;
            height: 26px;
            font-size: 0.7rem;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .icon-btn.edit-btn { background: rgba(255, 165, 2, 0.25); color: #ffa502; }
        .icon-btn.edit-btn:hover { background: #ffa502; color: #1e2a3a; }

        .icon-btn.delete-btn { background: rgba(255, 71, 87, 0.2); color: #ff4757; }
        .icon-btn.delete-btn:hover { background: #ff4757; color: white; }

        .player-area {
            background: rgba(0, 0, 0, 0.35);
            border-radius: 1.5rem;
            padding: 1rem;
            min-height: 100px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .player-area audio {
            width: 100%;
            max-width: 500px;
            border-radius: 12px;
            background: rgba(0,0,0,0.3);
        }

        .player-area audio::-webkit-media-controls-panel {
            background: rgba(0,0,0,0.5);
        }

        .placeholder-text {
            color: #5a6f8a;
            font-size: 1rem;
            letter-spacing: 0.5px;
        }

        .counter {
            font-size: 0.7rem;
            color: #5a6f8a;
            margin-top: 0.6rem;
            text-align: right;
        }

        .no-results {
            color: #5a6f8a;
            padding: 1rem 0;
            text-align: center;
            width: 100%;
            font-style: italic;
        }

        @media (max-width: 650px) {
            .music-hub { padding: 1rem; }
            .track-item { padding: 0.2rem 0.5rem 0.2rem 0.8rem; }
            .track-btn { font-size: 0.7rem; }
            .login-card { padding: 1.8rem 1.2rem; }
            .header-flex h1 { font-size: 1.3rem; }
        }

        @media (max-width: 450px) {
            .admin-actions-row input { min-width: 100px; }
            .login-buttons .login-btn { font-size: 0.9rem; padding: 0.7rem; }
        }
    </style>
</head>
<body>

<!-- ========== СТРАНИЦА ВХОДА ========== -->
<div id="loginOverlay" class="login-overlay">
    <div class="login-card">
        <div class="logo">🎧</div>
        <h2>МузАрхив</h2>
        <p class="subtitle">слушай свою музыку</p>

        <div class="login-buttons">
            <button class="login-btn user-btn" id="userLoginBtn">
                👤 Войти как пользователь
            </button>
            <div class="login-divider">— или —</div>
            <button class="login-btn admin-btn" id="showAdminLoginBtn">
                🔑 Войти как администратор
            </button>
        </div>

        <div class="admin-login-fields" id="adminLoginFields" style="display: none;">
            <div class="input-group">
                <label>👤 Логин</label>
                <input type="text" id="adminLoginInput" placeholder="admin" autocomplete="off">
            </div>
            <div class="input-group">
                <label>🔑 Пароль</label>
                <input type="password" id="adminPasswordInput" placeholder="••••••">
            </div>
            <button class="login-submit-btn" id="adminSubmitBtn">Войти как админ</button>
            <div id="loginError" class="error-msg">❌ Неверный логин или пароль</div>
        </div>
    </div>
</div>

<!-- ========== ОСНОВНОЕ ПРИЛОЖЕНИЕ ========== -->
<div class="music-hub" id="musicApp">
    <div class="header-flex">
        <h1>🎧 моя музыка</h1>
        <div class="header-right">
            <span id="roleBadge" class="badge user">👤 ПОЛЬЗОВАТЕЛЬ</span>
            <button class="logout-btn" id="logoutBtn">🚪 Выйти</button>
        </div>
    </div>

    <div class="search-area">
        <input type="text" id="searchInput" placeholder="🔍 Поиск по названию трека...">
    </div>

    <div class="admin-panel" id="adminPanel">
        <div class="admin-title">🛠️ АДМИН-ПАНЕЛЬ</div>
        <div class="admin-actions-row">
            <input type="text" id="newTrackName" placeholder="Название (например: Мой трек)">
            <input type="text" id="newTrackFile" placeholder="Имя файла (например: 1.mp3)">
            <button id="addTrackBtn" class="admin-btn">➕ Добавить трек</button>
        </div>
        <div class="admin-hint">
            💡 Добавьте файлы в папку <code>music/</code> на GitHub, затем укажите имя файла в поле выше.
            Пример: файл <code>1.mp3</code> → название <code>Мой трек</code>
        </div>
    </div>

    <div id="trackListContainer" class="track-grid"></div>

    <div class="player-area" id="playerArea">
        <span class="placeholder-text">🎵 выбери трек</span>
    </div>

    <div class="counter" id="trackCounter"></div>
</div>

<script>
    // ============================================================
    //  СПИСОК ТРЕКОВ — ДОБАВЛЯЙТЕ СВОИ ФАЙЛЫ ЗДЕСЬ!
    // ============================================================
    //  👇 Просто перечисляйте ваши MP3 файлы из папки music/
    //  Формат: { name: "Название для отображения", file: "имя_файла.mp3" }
    // ============================================================
    let tracksLibrary = [
        { name: "Трек 1", file: "1.mp3" },
        { name: "Трек 2", file: "2.mp3" },
        { name: "Трек 3", file: "3.mp3" },
        { name: "Трек 4", file: "4.mp3" },
        { name: "Трек 5", file: "5.mp3" },
        // Добавляйте свои треки здесь!
        // { name: "Мой любимый трек", file: "мой_трек.mp3" },
        // { name: "Ещё один трек", file: "ещё_один.mp3" },
    ];

    // ============================================================
    //  ГЛОБАЛЬНЫЕ ПЕРЕМЕННЫЕ
    // ============================================================
    let currentUserRole = "user";
    let activeTrackIndex = -1;
    let searchQuery = "";

    // DOM
    const loginOverlay = document.getElementById('loginOverlay');
    const musicApp = document.getElementById('musicApp');
    const roleBadge = document.getElementById('roleBadge');
    const adminPanel = document.getElementById('adminPanel');
    const logoutBtn = document.getElementById('logoutBtn');
    const trackListContainer = document.getElementById('trackListContainer');
    const playerArea = document.getElementById('playerArea');
    const trackCounter = document.getElementById('trackCounter');
    const searchInput = document.getElementById('searchInput');

    const userLoginBtn = document.getElementById('userLoginBtn');
    const showAdminLoginBtn = document.getElementById('showAdminLoginBtn');
    const adminLoginFields = document.getElementById('adminLoginFields');
    const adminLoginInput = document.getElementById('adminLoginInput');
    const adminPasswordInput = document.getElementById('adminPasswordInput');
    const adminSubmitBtn = document.getElementById('adminSubmitBtn');
    const loginError = document.getElementById('loginError');

    const addTrackBtn = document.getElementById('addTrackBtn');
    const newTrackName = document.getElementById('newTrackName');
    const newTrackFile = document.getElementById('newTrackFile');

    // ============================================================
    //  ФУНКЦИИ
    // ============================================================

    function showPlayer(index) {
        if (!tracksLibrary[index]) return;
        const track = tracksLibrary[index];
        const url = `music/${track.file}`;
        playerArea.innerHTML = `
            <audio controls autoplay>
                <source src="${url}" type="audio/mpeg">
                Ваш браузер не поддерживает аудио
            </audio>
        `;
        const audio = playerArea.querySelector('audio');
        if (audio) {
            audio.style.width = '100%';
            audio.style.maxWidth = '500px';
        }
    }

    function renderTrackList() {
        const query = searchQuery.toLowerCase().trim();
        const filtered = tracksLibrary.filter((t) => {
            return t.name.toLowerCase().includes(query) || t.file.toLowerCase().includes(query);
        });

        trackListContainer.innerHTML = '';

        if (filtered.length === 0) {
            if (tracksLibrary.length === 0) {
                trackListContainer.innerHTML = `<div class="no-results">📂 Нет треков. Добавьте их в список в коде.</div>`;
            } else {
                trackListContainer.innerHTML = `<div class="no-results">🔍 ничего не найдено</div>`;
            }
            return;
        }

        filtered.forEach((track) => {
            const origIdx = tracksLibrary.indexOf(track);
            const div = document.createElement('div');
            div.className = 'track-item';

            const btn = document.createElement('button');
            btn.textContent = `🎵 ${track.name}`;
            btn.className = 'track-btn';
            if (activeTrackIndex === origIdx) btn.classList.add('active');
            btn.addEventListener('click', () => {
                activeTrackIndex = origIdx;
                renderTrackList();
                showPlayer(origIdx);
            });

            div.appendChild(btn);

            if (currentUserRole === 'admin') {
                const actions = document.createElement('div');
                actions.className = 'admin-actions';

                const editBtn = document.createElement('button');
                editBtn.textContent = '✏️';
                editBtn.className = 'icon-btn edit-btn';
                editBtn.title = 'Редактировать';
                editBtn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const newName = prompt('Новое название:', track.name);
                    if (newName && newName.trim()) {
                        track.name = newName.trim();
                        renderTrackList();
                    }
                });

                const delBtn = document.createElement('button');
                delBtn.textContent = '🗑️';
                delBtn.className = 'icon-btn delete-btn';
                delBtn.title = 'Удалить';
                delBtn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    if (confirm(`Удалить "${track.name}"?`)) {
                        const idx = tracksLibrary.indexOf(track);
                        if (idx > -1) {
                            tracksLibrary.splice(idx, 1);
                            if (activeTrackIndex === idx) {
                                activeTrackIndex = -1;
                                playerArea.innerHTML = `<span class="placeholder-text">🎵 трек удалён</span>`;
                            } else if (activeTrackIndex > idx) {
                                activeTrackIndex--;
                            }
                            renderTrackList();
                            updateCounter();
                        }
                    }
                });

                actions.appendChild(editBtn);
                actions.appendChild(delBtn);
                div.appendChild(actions);
            }

            trackListContainer.appendChild(div);
        });
    }

    function updateCounter() {
        trackCounter.textContent = `🎵 всего треков: ${tracksLibrary.length}`;
    }

    function addTrack() {
        const name = newTrackName.value.trim();
        const file = newTrackFile.value.trim();

        if (!name || !file) {
            alert('Заполните название и имя файла');
            return;
        }

        // Проверяем, не существует ли уже такой файл
        if (tracksLibrary.some(t => t.file === file)) {
            alert('Файл с таким именем уже есть в списке');
            return;
        }

        tracksLibrary.push({ name, file });
        newTrackName.value = '';
        newTrackFile.value = '';
        renderTrackList();
        updateCounter();
    }

    // ============================================================
    //  АВТОРИЗАЦИЯ
    // ============================================================

    function loginAsUser() {
        currentUserRole = 'user';
        setupUI();
        loginOverlay.style.display = 'none';
        musicApp.classList.add('visible');
        renderTrackList();
        updateCounter();
    }

    function loginAsAdmin() {
        const login = adminLoginInput.value.trim();
        const pass = adminPasswordInput.value.trim();

        if (login === 'admin' && pass === '1423') {
            currentUserRole = 'admin';
            setupUI();
            loginOverlay.style.display = 'none';
            musicApp.classList.add('visible');
            loginError.style.display = 'none';
            renderTrackList();
            updateCounter();
        } else {
            loginError.style.display = 'block';
            setTimeout(() => { loginError.style.display = 'none'; }, 2000);
        }
    }

    function setupUI() {
        if (currentUserRole === 'admin') {
            adminPanel.classList.add('visible');
            roleBadge.textContent = '👑 АДМИНИСТРАТОР';
            roleBadge.className = 'badge admin';
        } else {
            adminPanel.classList.remove('visible');
            roleBadge.textContent = '👤 ПОЛЬЗОВАТЕЛЬ';
            roleBadge.className = 'badge user';
        }
    }

    function logout() {
        currentUserRole = 'user';
        activeTrackIndex = -1;
        searchQuery = '';
        searchInput.value = '';
        loginOverlay.style.display = 'flex';
        musicApp.classList.remove('visible');
        playerArea.innerHTML = `<span class="placeholder-text">🎵 выбери трек</span>`;
        adminLoginInput.value = '';
        adminPasswordInput.value = '';
        loginError.style.display = 'none';
        adminLoginFields.style.display = 'none';
        renderTrackList();
    }

    // ============================================================
    //  СОБЫТИЯ
    // ============================================================

    userLoginBtn.addEventListener('click', loginAsUser);

    showAdminLoginBtn.addEventListener('click', () => {
        adminLoginFields.style.display = adminLoginFields.style.display === 'none' ? 'block' : 'none';
    });

    adminSubmitBtn.addEventListener('click', loginAsAdmin);

    adminLoginInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') loginAsAdmin(); });
    adminPasswordInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') loginAsAdmin(); });

    logoutBtn.addEventListener('click', logout);

    searchInput.addEventListener('input', () => {
        searchQuery = searchInput.value;
        renderTrackList();
    });

    addTrackBtn.addEventListener('click', addTrack);

    newTrackName.addEventListener('keypress', (e) => { if (e.key === 'Enter') addTrack(); });
    newTrackFile.addEventListener('keypress', (e) => { if (e.key === 'Enter') addTrack(); });

    // ============================================================
    //  ИНИЦИАЛИЗАЦИЯ
    // ============================================================

    renderTrackList();
    updateCounter();

    // Стили для audio
    const styleEl = document.createElement('style');
    styleEl.textContent = `
        audio {
            width: 100%;
            max-width: 500px;
            border-radius: 12px;
            background: rgba(0,0,0,0.3);
        }
        audio::-webkit-media-controls-panel {
            background: rgba(20,30,50,0.9);
        }
        audio::-webkit-media-controls-play-button {
            background: #3b6eff;
            border-radius: 50%;
        }
    `;
    document.head.appendChild(styleEl);
</script>

</body>
</html>
